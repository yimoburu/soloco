name: Full qualification
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      commit:
        description: Optional exact 40-character candidate commit; defaults to the selected ref's event commit
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualification22:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'qualification-ready'
    name: Full qualification Node 22 (${{ matrix.shard }}/2)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      QUALIFICATION_COMMIT: ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}
      CI_SHARD: ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Require an exact candidate commit
        run: |
          if [[ ! "$QUALIFICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Qualification requires an exact 40-character commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.QUALIFICATION_COMMIT }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Run complete qualification shard
        run: |
          node tools/ci/check.mjs tests-22 --shard "$CI_SHARD" 2>&1 | tee "$RUNNER_TEMP/qualification.log"
      - name: Upload diagnostic log (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-tests-22-${{ matrix.shard }}
          path: ${{ runner.temp }}/qualification.log
          if-no-files-found: warn
          retention-days: 30
  full22:
    name: Full qualification Node 22
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'qualification-ready')
    needs: [qualification22]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every full qualification shard
        env:
          QUALIFICATION: ${{ needs.qualification22.result }}
        run: |
          if [[ "$QUALIFICATION" != success ]]; then
            echo "Every full qualification shard must succeed; aggregate result: $QUALIFICATION" >&2
            exit 1
          fi
  qualification:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'qualification-ready'
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      QUALIFICATION_COMMIT: ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '26'
            lane: compatibility-26
            name: Compatibility Node 26
    steps:
      - name: Require an exact candidate commit
        run: |
          if [[ ! "$QUALIFICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Qualification requires an exact 40-character commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.QUALIFICATION_COMMIT }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Run requested qualification
        run: node tools/ci/check.mjs ${{ matrix.lane }} 2>&1 | tee "$RUNNER_TEMP/qualification.log"
      - name: Upload diagnostic log (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/qualification.log
          if-no-files-found: warn
          retention-days: 30
