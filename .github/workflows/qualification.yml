name: Full qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    name: Full qualification Node 22
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Every test including complete historical qualification
        run: node tools/ci/run.mjs tests-22 "$RUNNER_TEMP/source-ci"
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-ci-${{ github.run_id }}-${{ github.run_attempt }}-tests-22
          path: ${{ runner.temp }}/source-ci/
          if-no-files-found: error
          retention-days: 30
