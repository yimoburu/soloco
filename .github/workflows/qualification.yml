name: Full qualification
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualification:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            lane: tests-22
            name: Full qualification Node 22
          - node: '26'
            lane: compatibility-26
            name: Compatibility Node 26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Run requested qualification
        run: node tools/ci/check.mjs ${{ matrix.lane }} 2>&1 | tee "$RUNNER_TEMP/qualification.log"
      - name: Upload diagnostic log (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/qualification.log
          if-no-files-found: warn
          retention-days: 30
