name: Source CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    name: Regression Node 22 (${{ matrix.shard }}/4)
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Regression tests
        env:
          CI_SHARD: ${{ matrix.shard }}/4
        run: node tools/ci/check.mjs regression-22 --shard "$CI_SHARD" 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Upload diagnostic log (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: warn
          retention-days: 30
  tests:
    name: Tests Node 22
    if: always()
    needs: [regression]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every regression shard
        env:
          REGRESSION: ${{ needs.regression.result }}
        run: |
          if [[ "$REGRESSION" != success ]]; then
            echo "Every regression shard must succeed; aggregate result: $REGRESSION" >&2
            exit 1
          fi
  build:
    name: Build and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify pinned companion source
        run: |
          python3 -B native/codex/tools/protected_native.py verify
          python3 -B -m unittest discover -s native/codex/tools -p test_protected_native.py -v
      - run: node tools/ci/check.mjs build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Upload diagnostic log (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 30
  gate:
    name: CI gate
    if: always()
    needs: [tests, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require regression and build success
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [[ "$TESTS" != success || "$BUILD" != success ]]; then
            echo "Required jobs must succeed; tests=$TESTS build=$BUILD" >&2
            exit 1
          fi
